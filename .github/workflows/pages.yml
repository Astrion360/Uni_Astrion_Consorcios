name: Publicar UniAstrion Consórcios
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar portal
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Configurar e habilitar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
